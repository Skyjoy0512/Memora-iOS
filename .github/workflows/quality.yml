name: Host quality checks

# GitHub Actions の予算上限に達したため、完整スイートは手動実行のみ。
# 予算が回復したら pull_request / push を戻す。
# pull_request では、変更された入力に依存する軽い検査だけを回す。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "App/**"
      - "Shared/**"
      - "tools/checks/check-motion-policy.py"
      - "tools/checks/test_design_tokens.py"
      - "tools/checks/ui-surface-audit.mjs"
      - "tools/checks/run-leak-scan.sh"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: host-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-gates:
    # 予算を使わず、secret と design token / motion policy だけを検査する。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report the toolchain
        run: |
          python3 --version
      - name: Scan for leaked credentials
        run: bash tools/checks/run-leak-scan.sh
      - name: Check the design tokens and the motion policy
        run: |
          python3 -B tools/checks/test_design_tokens.py
          python3 -B tools/checks/check-motion-policy.py

  host-checks:
    # https://github.blog/changelog/2026-10-15-xcode-27-runner-image-generally-available/
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SWIFT_BACKTRACE: enable=no
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report toolchain and require an iOS Simulator SDK
        run: |
          swiftc --version
          xcrun --sdk iphonesimulator --show-sdk-version
          python3 --version
      - name: Run production host checks
        env:
          MEMORA_CHECK_ROOT: ${{ runner.temp }}/memora-checks
          MEMORA_CHECK_TMPDIR: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}/
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
          SWIFT_MODULECACHE_PATH: ${{ runner.temp }}/swift-module-cache
        run: |
          mkdir -p "$MEMORA_CHECK_ROOT" "$CLANG_MODULE_CACHE_PATH" "$SWIFT_MODULECACHE_PATH"
          python3 -B tools/checks/test_quality_runner.py
          bash tools/checks/run-quality-checks.sh --output-dir "$RUNNER_TEMP/memora-quality-results"
      - name: Upload actual suite logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-quality-results
          path: ${{ runner.temp }}/memora-quality-results
          if-no-files-found: error
          retention-days: 14
      - name: Check all 65 presentation layouts and inline links
        shell: bash
        env:
          MEMORA_CHECK_ROOT: ${{ runner.temp }}/memora-presentation-checks
          TMPDIR: ${{ runner.temp }}/
        run: |
          python3 -B tools/checks/test_ci_failure_propagation.py
          mkdir -p "$MEMORA_CHECK_ROOT"
          bash tools/checks/run-presentation-checks.sh 2>&1 | tee "$MEMORA_CHECK_ROOT/presentation.log"
          bash tools/checks/run-artifact-operation-checks.sh --presentation-revision 2>&1 | tee "$MEMORA_CHECK_ROOT/presentation-access.log"
          bash tools/checks/run-inline-link-checks.sh 2>&1 | tee "$MEMORA_CHECK_ROOT/inline-links.log"
          python3 -B tools/checks/verify-oss-resources.py 2>&1 | tee "$MEMORA_CHECK_ROOT/oss.log"
      - name: Upload presentation outputs and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: presentation-and-inline-link-checks
          path: ${{ runner.temp }}/memora-presentation-checks
          if-no-files-found: error
          retention-days: 14
